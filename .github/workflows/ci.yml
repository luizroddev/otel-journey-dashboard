name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        # MongoDB 8 does not start on Linux kernels 6.19 to 7.0.13 (its
        # TCMalloc), which hosted runners use; the schema works on 7 too.
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for MongoDB
        run: for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/27017) 2>/dev/null && exit 0; sleep 1; done; exit 1
      - run: npm run typecheck
      - run: npm test
        env:
          MONGO_URL: mongodb://localhost:27017
      - run: npm run build
      - name: Conformance against the bundled receiver
        run: |
          MONGO_URL=mongodb://localhost:27017 PORT=8686 node dist/server/src/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8686/health && break; sleep 1; done
          npm run conformance

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t otel-journey-dashboard .
