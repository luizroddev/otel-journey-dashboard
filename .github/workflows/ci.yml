name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          MONGO_URL: mongodb://localhost:27017
      - run: npm run build
      - name: Conformance against the bundled receiver
        run: |
          MONGO_URL=mongodb://localhost:27017 PORT=8686 node dist/server/src/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8686/health && break; sleep 1; done
          npm run conformance

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t otel-journey-dashboard .
